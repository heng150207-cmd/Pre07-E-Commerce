<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cartora - Sign In / Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        // All of the bespoke CSS from the original <style> block (card mechanics,
        // sliding overlay, keyframes, the 820px mobile fallback) has been moved
        // in here as Tailwind theme config + utility classes on the markup below.
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    // Custom breakpoint that matches the original `max-width: 820px`
                    // mobile fallback. Base (unprefixed) classes below are the mobile
                    // styles; `card:` classes kick in for the desktop sliding-panel layout.
                    screens: {
                        card: '821px',
                    },
                    keyframes: {
                        cardFadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(20px) scale(0.98)' },
                            '100%': { opacity: 1, transform: 'translateY(0) scale(1)' },
                        },
                        gradientDrift: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                        revealForm: {
                            '0%, 45%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                    },
                    animation: {
                        cardFadeIn: 'cardFadeIn 0.8s cubic-bezier(0.22,1,0.36,1) both',
                        gradientDrift: 'gradientDrift 8s ease-in-out infinite',
                        revealForm: 'revealForm 0.7s',
                    },
                    transitionTimingFunction: {
                        slide: 'cubic-bezier(0.65,0,0.35,1)',
                    },
                },
            },
        };
    </script>

    <style>
        /* Respect reduced-motion preference — kept as raw CSS since Tailwind has
           no utility for "disable all animation/transition under a media query". */
        @media (prefers-reduced-motion: reduce) {

            .auth-card,
            .overlay,
            .form-container,
            .overlay-container,
            .overlay-panel {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body class="font-poppins bg-gray-100 min-h-screen min-h-[100dvh]">

    <div
        class="flex items-center justify-center min-h-[100dvh] w-full p-6 card:p-6 pt-[max(0.5rem,env(safe-area-inset-top))] pb-[max(0.5rem,env(safe-area-inset-bottom))] card:pt-6 card:pb-6">
        <div id="authCard" class="auth-card group relative w-full max-w-[900px] bg-white rounded-[1.75rem] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.25)] overflow-hidden animate-cardFadeIn
                   h-auto max-h-[calc(100dvh-1rem)] overflow-y-auto flex flex-col
                   card:h-[560px] card:max-h-none card:block">

            <!-- SIGN UP FORM -->
            <div
                class="form-container sign-up-container
                        hidden opacity-100 order-2 w-full h-auto p-5 sm:px-6
                        group-[.right-panel-active]:flex group-[.right-panel-active]:flex-col group-[.right-panel-active]:items-center group-[.right-panel-active]:justify-center
                        card:flex card:flex-col card:items-center card:justify-center card:absolute card:top-0 card:left-0 card:z-[1] card:w-1/2 card:h-full card:px-12 card:py-10 card:opacity-0 card:pointer-events-none
                        card:transition-[transform,opacity] card:duration-700 card:ease-slide
                        group-[.right-panel-active]:card:translate-x-full group-[.right-panel-active]:card:opacity-100 group-[.right-panel-active]:card:z-[5] group-[.right-panel-active]:card:pointer-events-auto group-[.right-panel-active]:card:animate-revealForm">
                <div class="w-full max-w-[340px] mx-auto">
                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 sm:mb-6 text-center">
                        Create Account
                    </h1>

                    <div class="flex justify-center gap-3 mb-4 sm:mb-6">
                        <button aria-label="Sign up with Google"
                            class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-xl border border-gray-200 transition-all duration-300 hover:bg-gray-50 active:scale-95">
                            <svg class="w-5 h-5" viewBox="0 0 48 48">
                                <path fill="#FFC107"
                                    d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z" />
                                <path fill="#FF3D00"
                                    d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 7.1 29.6 5 24 5c-7.8 0-14.5 4.4-17.7 10.7z" />
                                <path fill="#4CAF50"
                                    d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.4-11.2-8l-6.6 5C9.4 39.5 16.1 44 24 44z" />
                                <path fill="#1976D2"
                                    d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.4C39.9 36.8 44 31.3 44 24c0-1.3-.1-2.3-.4-3.5z" />
                            </svg>
                        </button>
                        <button aria-label="Sign up with Facebook"
                            class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-xl border border-gray-200 transition-all duration-300 hover:bg-gray-50 active:scale-95">
                            <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8v-6.93H7.9V12H10V9.8c0-2.07 1.23-3.22 3.11-3.22.9 0 1.84.16 1.84.16v2.02h-1.04c-1.02 0-1.34.64-1.34 1.29V12h2.28l-.36 2.87h-1.92V21.8c4.56-.93 8-4.96 8-9.8z" />
                            </svg>
                        </button>
                        <button aria-label="Sign up with Telegram"
                            class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-xl border border-gray-200 transition-all duration-300 hover:bg-gray-50 active:scale-95">
                            <svg class="w-5 h-5 text-sky-500" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M21.94 3.36L2.6 10.94c-1.32.53-1.31 1.27-.24 1.6l4.95 1.55 1.92 5.86c.24.66.42.92.86.92.42 0 .6-.19.83-.4l2.02-1.94 4.2 3.1c.77.42 1.33.2 1.52-.72l2.76-13c.28-1.13-.43-1.64-1.28-1.55z" />
                            </svg>
                        </button>
                    </div>

                    <p class="text-center text-xs sm:text-sm text-gray-500 mb-3 sm:mb-4">Register with E-mail</p>

                    <form id="signup-form" class="space-y-3 sm:space-y-4">
                        <div id="signup-message" class="text-center text-sm text-red-600 mb-1 hidden"></div>
                        <div>
                            <label class="block text-xs sm:text-sm text-gray-500 mb-1">Name</label>
                            <input id="signup-name" type="text" required
                                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 sm:px-4 sm:py-2.5 text-sm sm:text-base shadow-sm transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-400" />
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm text-gray-500 mb-1">Email</label>
                            <input id="signup-email" type="email" required
                                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 sm:px-4 sm:py-2.5 text-sm sm:text-base shadow-sm transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-400" />
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm text-gray-500 mb-1">Password</label>
                            <input id="signup-password" type="password" required
                                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 sm:px-4 sm:py-2.5 text-sm sm:text-base shadow-sm transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-400" />
                        </div>
                        <div class="pt-1">
                            <button type="submit"
                                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 sm:py-3 text-sm sm:text-base rounded-full shadow-md transition-all duration-300 active:scale-[0.97]">
                                SIGN UP
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- SIGN IN FORM -->
            <div
                class="form-container sign-in-container
                        flex flex-col items-center justify-center order-2 w-full h-auto p-5 sm:px-6
                        group-[.right-panel-active]:hidden
                        card:absolute card:top-0 card:left-0 card:z-[2] card:w-1/2 card:h-full card:px-12 card:py-10
                        card:transition-[transform,opacity] card:duration-700 card:ease-slide
                        group-[.right-panel-active]:card:flex group-[.right-panel-active]:card:-translate-x-0 group-[.right-panel-active]:card:translate-x-full group-[.right-panel-active]:card:opacity-0 group-[.right-panel-active]:card:pointer-events-none">
                <div class="w-full max-w-[340px] mx-auto">
                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 sm:mb-6 text-center">
                        Sign In
                    </h1>

                    <div class="flex justify-center gap-3 mb-4 sm:mb-6">
                        <button aria-label="Sign in with Google"
                            class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-xl border border-gray-200 transition-all duration-300 hover:bg-gray-50 active:scale-95">
                            <svg class="w-5 h-5" viewBox="0 0 48 48">
                                <path fill="#FFC107"
                                    d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z" />
                                <path fill="#FF3D00"
                                    d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 7.1 29.6 5 24 5c-7.8 0-14.5 4.4-17.7 10.7z" />
                                <path fill="#4CAF50"
                                    d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.4-11.2-8l-6.6 5C9.4 39.5 16.1 44 24 44z" />
                                <path fill="#1976D2"
                                    d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.4C39.9 36.8 44 31.3 44 24c0-1.3-.1-2.3-.4-3.5z" />
                            </svg>
                        </button>
                        <button aria-label="Sign in with Facebook"
                            class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-xl border border-gray-200 transition-all duration-300 hover:bg-gray-50 active:scale-95">
                            <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8v-6.93H7.9V12H10V9.8c0-2.07 1.23-3.22 3.11-3.22.9 0 1.84.16 1.84.16v2.02h-1.04c-1.02 0-1.34.64-1.34 1.29V12h2.28l-.36 2.87h-1.92V21.8c4.56-.93 8-4.96 8-9.8z" />
                            </svg>
                        </button>
                        <button aria-label="Sign in with Telegram"
                            class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-xl border border-gray-200 transition-all duration-300 hover:bg-gray-50 active:scale-95">
                            <svg class="w-5 h-5 text-sky-500" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M21.94 3.36L2.6 10.94c-1.32.53-1.31 1.27-.24 1.6l4.95 1.55 1.92 5.86c.24.66.42.92.86.92.42 0 .6-.19.83-.4l2.02-1.94 4.2 3.1c.77.42 1.33.2 1.52-.72l2.76-13c.28-1.13-.43-1.64-1.28-1.55z" />
                            </svg>
                        </button>
                    </div>

                    <p class="text-center text-xs sm:text-sm text-gray-500 mb-3 sm:mb-4">Or sign in with E-mail</p>

                    <form id="signin-form" class="space-y-3 sm:space-y-4">
                        <div id="signin-message" class="text-center text-sm text-red-600 mb-1 hidden"></div>
                        <div>
                            <label class="block text-xs sm:text-sm text-gray-500 mb-1">E-mail</label>
                            <input id="signin-email" type="email" required
                                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 sm:px-4 sm:py-2.5 text-sm sm:text-base shadow-sm transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-400" />
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm text-gray-500 mb-1">Password</label>
                            <input id="signin-password" type="password" required
                                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 sm:px-4 sm:py-2.5 text-sm sm:text-base shadow-sm transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-orange-400" />
                        </div>
                        <p class="text-center text-xs sm:text-sm text-gray-500 pt-1">
                            <a href="#" class="transition-all duration-300 hover:text-gray-700">Forget Password?</a>
                        </p>
                        <div class="pt-1">
                            <button type="submit"
                                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 sm:py-3 text-sm sm:text-base rounded-full shadow-md transition-all duration-300 active:scale-[0.97]">
                                SIGN IN
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- SLIDING ORANGE OVERLAY -->
            <div class="overlay-container
                        relative order-1 w-full h-auto
                        card:absolute card:top-0 card:left-1/2 card:w-1/2 card:h-full card:overflow-hidden card:z-[100]
                        card:transition-transform card:duration-700 card:ease-slide
                        group-[.right-panel-active]:card:-translate-x-full">
                <div class="overlay
                            relative left-0 w-full h-auto text-white
                            card:left-[-100%] card:w-[200%] card:h-full
                            bg-gradient-to-br from-orange-400 via-orange-500 to-orange-600 bg-[length:220%_220%]
                            card:animate-gradientDrift
                            card:transition-transform card:duration-700 card:ease-slide card:translate-x-0
                            group-[.right-panel-active]:card:translate-x-1/2">

                    <div class="overlay-panel overlay-left
                                hidden relative w-full h-auto flex-col items-center justify-center text-center p-6
                                group-[.right-panel-active]:flex
                                card:flex card:absolute card:top-0 card:h-full card:w-1/2 card:px-11 card:py-10
                                card:transition-transform card:duration-700 card:ease-slide card:-translate-x-[20%]
                                group-[.right-panel-active]:card:translate-x-0">
                        <h2 class="text-2xl sm:text-3xl font-extrabold leading-tight mb-2 md:mb-4">
                            Welcome To<br />CARTORA
                        </h2>
                        <p class="text-xs sm:text-sm md:text-base text-white/90 mb-4 md:mb-6">Sign in to find your
                            product</p>
                        <button id="goSignIn" type="button"
                            class="text-white font-bold px-6 py-2 sm:px-8 sm:py-2.5 text-xs sm:text-sm md:text-base rounded-full bg-transparent border-[1.5px] border-white/85 transition-all duration-300 hover:bg-white/10 active:scale-95">
                            SIGN IN
                        </button>
                    </div>

                    <div class="overlay-panel overlay-right
                                flex relative w-full h-auto flex-col items-center justify-center text-center p-6
                                group-[.right-panel-active]:hidden
                                card:flex card:absolute card:top-0 card:right-0 card:h-full card:w-1/2 card:px-11 card:py-10
                                card:transition-transform card:duration-700 card:ease-slide card:translate-x-0
                                group-[.right-panel-active]:card:translate-x-[20%]">
                        <h2 class="text-2xl sm:text-3xl font-extrabold leading-tight mb-2 md:mb-4">
                            Easy shopping with<br />CARTORA
                        </h2>
                        <p class="text-xs sm:text-sm md:text-base text-white/90 mb-4 md:mb-6">Sign up now to enjoy your
                            shopping</p>
                        <button id="goSignUp" type="button"
                            class="text-white font-bold px-6 py-2 sm:px-8 sm:py-2.5 text-xs sm:text-sm md:text-base rounded-full bg-transparent border-[1.5px] border-white/85 transition-all duration-300 hover:bg-white/10 active:scale-95">
                            SIGN UP
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const authCard = document.getElementById('authCard');
        document.getElementById('goSignUp').addEventListener('click', () => {
            authCard.classList.add('right-panel-active');
        });
        document.getElementById('goSignIn').addEventListener('click', () => {
            authCard.classList.remove('right-panel-active');
        });
    </script>
    <script src="./auth.js" defer></script>
</body>

</html>
