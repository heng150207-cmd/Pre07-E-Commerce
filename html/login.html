<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>Cartora - Sign In / Sign Up</title>

  <link rel="stylesheet" href="../src/output.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body class="min-h-screen min-h-[100dvh] bg-gray-100 font-['Poppins']">
  <main
    class="flex min-h-[100dvh] w-full items-center justify-center p-4 sm:p-6
           pt-[max(0.5rem,env(safe-area-inset-top))]
           pb-[max(0.5rem,env(safe-area-inset-bottom))]"
  >
    <section
      id="authCard"
      class="group relative flex w-full max-w-[900px] flex-col overflow-hidden
             rounded-[1.75rem] bg-white shadow-[0_25px_60px_-15px_rgba(0,0,0,0.25)]
             opacity-0 translate-y-5 scale-[0.98]
             transition-all duration-700 ease-out
             md:block md:h-[560px]"
      aria-label="Authentication"
    >
      <!-- SIGN UP FORM -->
      <div
        class="order-2 hidden w-full flex-col items-center justify-center p-5 sm:px-6
               group-[.right-panel-active]:flex
               md:absolute md:left-0 md:top-0 md:flex md:h-full md:w-1/2
               md:translate-x-0 md:opacity-0 md:pointer-events-none
               md:transition-all md:duration-700 md:ease-in-out
               md:group-[.right-panel-active]:translate-x-full
               md:group-[.right-panel-active]:opacity-100
               md:group-[.right-panel-active]:pointer-events-auto"
      >
        <div class="mx-auto w-full max-w-[340px]">
          <h1 class="mb-4 text-center text-2xl font-extrabold text-gray-900 sm:mb-6 sm:text-3xl md:text-4xl">
            Create Account
          </h1>

          <div class="mb-4 flex justify-center gap-3 sm:mb-6">
            <button
              type="button"
              aria-label="Sign up with Google"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200
                     transition-all duration-300 hover:bg-gray-50 active:scale-95 sm:h-12 sm:w-12"
            >
              <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 7.1 29.6 5 24 5c-7.8 0-14.5 4.4-17.7 10.7z"/>
                <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.4-11.2-8l-6.6 5C9.4 39.5 16.1 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.4C39.9 36.8 44 31.3 44 24c0-1.3-.1-2.3-.4-3.5z"/>
              </svg>
            </button>

            <button
              type="button"
              aria-label="Sign up with Facebook"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200
                     transition-all duration-300 hover:bg-gray-50 active:scale-95 sm:h-12 sm:w-12"
            >
              <svg class="h-5 w-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8v-6.93H7.9V12H10V9.8c0-2.07 1.23-3.22 3.11-3.22.9 0 1.84.16 1.84.16v2.02h-1.04c-1.02 0-1.34.64-1.34 1.29V12h2.28l-.36 2.87h-1.92V21.8c4.56-.93 8-4.96 8-9.8z"/>
              </svg>
            </button>

            <button
              type="button"
              aria-label="Sign up with Telegram"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200
                     transition-all duration-300 hover:bg-gray-50 active:scale-95 sm:h-12 sm:w-12"
            >
              <svg class="h-5 w-5 text-sky-500" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.94 3.36L2.6 10.94c-1.32.53-1.31 1.27-.24 1.6l4.95 1.55 1.92 5.86c.24.66.42.92.86.92.42 0 .6-.19.83-.4l2.02-1.94 4.2 3.1c.77.42 1.33.2 1.52-.72l2.76-13c.28-1.13-.43-1.64-1.28-1.55z"/>
              </svg>
            </button>
          </div>

          <p class="mb-3 text-center text-xs text-gray-500 sm:mb-4 sm:text-sm">
            Register with email
          </p>

          <form id="signup-form" class="space-y-3 sm:space-y-4">
            <div
              id="signup-message"
              class="mb-1 hidden text-center text-sm text-red-600"
              role="alert"
              aria-live="polite"
            ></div>

            <div>
              <label for="signup-name" class="mb-1 block text-xs text-gray-500 sm:text-sm">
                Name
              </label>
              <input
                id="signup-name"
                name="name"
                type="text"
                autocomplete="name"
                required
                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 text-sm shadow-sm
                       transition-all duration-300 focus:outline-none focus:ring-2
                       focus:ring-orange-400 sm:px-4 sm:py-2.5 sm:text-base"
              >
            </div>

            <div>
              <label for="signup-email" class="mb-1 block text-xs text-gray-500 sm:text-sm">
                Email
              </label>
              <input
                id="signup-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 text-sm shadow-sm
                       transition-all duration-300 focus:outline-none focus:ring-2
                       focus:ring-orange-400 sm:px-4 sm:py-2.5 sm:text-base"
              >
            </div>

            <div>
              <label for="signup-password" class="mb-1 block text-xs text-gray-500 sm:text-sm">
                Password
              </label>
              <input
                id="signup-password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 text-sm shadow-sm
                       transition-all duration-300 focus:outline-none focus:ring-2
                       focus:ring-orange-400 sm:px-4 sm:py-2.5 sm:text-base"
              >
            </div>

            <div class="pt-1">
              <button
                type="submit"
                class="w-full rounded-full bg-orange-500 py-2.5 text-sm font-semibold text-white
                       shadow-md transition-all duration-300 hover:bg-orange-600 active:scale-[0.97]
                       disabled:cursor-not-allowed disabled:opacity-60 sm:py-3 sm:text-base"
              >
                SIGN UP
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- SIGN IN FORM -->
      <div
        class="order-2 flex w-full flex-col items-center justify-center p-5 sm:px-6
               group-[.right-panel-active]:hidden
               md:absolute md:left-0 md:top-0 md:flex md:h-full md:w-1/2
               md:translate-x-0 md:opacity-100
               md:transition-all md:duration-700 md:ease-in-out
               md:group-[.right-panel-active]:flex
               md:group-[.right-panel-active]:translate-x-full
               md:group-[.right-panel-active]:opacity-0
               md:group-[.right-panel-active]:pointer-events-none"
      >
        <div class="mx-auto w-full max-w-[340px]">
          <h1 class="mb-4 text-center text-2xl font-extrabold text-gray-900 sm:mb-6 sm:text-3xl md:text-4xl">
            Sign In
          </h1>

          <div class="mb-4 flex justify-center gap-3 sm:mb-6">
            <button
              type="button"
              aria-label="Sign in with Google"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200
                     transition-all duration-300 hover:bg-gray-50 active:scale-95 sm:h-12 sm:w-12"
            >
              <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.6 7.1 29.6 5 24 5c-7.8 0-14.5 4.4-17.7 10.7z"/>
                <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.4-11.2-8l-6.6 5C9.4 39.5 16.1 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.4C39.9 36.8 44 31.3 44 24c0-1.3-.1-2.3-.4-3.5z"/>
              </svg>
            </button>

            <button
              type="button"
              aria-label="Sign in with Facebook"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200
                     transition-all duration-300 hover:bg-gray-50 active:scale-95 sm:h-12 sm:w-12"
            >
              <svg class="h-5 w-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8v-6.93H7.9V12H10V9.8c0-2.07 1.23-3.22 3.11-3.22.9 0 1.84.16 1.84.16v2.02h-1.04c-1.02 0-1.34.64-1.34 1.29V12h2.28l-.36 2.87h-1.92V21.8c4.56-.93 8-4.96 8-9.8z"/>
              </svg>
            </button>

            <button
              type="button"
              aria-label="Sign in with Telegram"
              class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200
                     transition-all duration-300 hover:bg-gray-50 active:scale-95 sm:h-12 sm:w-12"
            >
              <svg class="h-5 w-5 text-sky-500" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.94 3.36L2.6 10.94c-1.32.53-1.31 1.27-.24 1.6l4.95 1.55 1.92 5.86c.24.66.42.92.86.92.42 0 .6-.19.83-.4l2.02-1.94 4.2 3.1c.77.42 1.33.2 1.52-.72l2.76-13c.28-1.13-.43-1.64-1.28-1.55z"/>
              </svg>
            </button>
          </div>

          <p class="mb-3 text-center text-xs text-gray-500 sm:mb-4 sm:text-sm">
            Or sign in with email
          </p>

          <form id="signin-form" class="space-y-3 sm:space-y-4">
            <div
              id="signin-message"
              class="mb-1 hidden text-center text-sm text-red-600"
              role="alert"
              aria-live="polite"
            ></div>

            <div>
              <label for="signin-email" class="mb-1 block text-xs text-gray-500 sm:text-sm">
                Email
              </label>
              <input
                id="signin-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 text-sm shadow-sm
                       transition-all duration-300 focus:outline-none focus:ring-2
                       focus:ring-orange-400 sm:px-4 sm:py-2.5 sm:text-base"
              >
            </div>

            <div>
              <label for="signin-password" class="mb-1 block text-xs text-gray-500 sm:text-sm">
                Password
              </label>
              <input
                id="signin-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="w-full rounded-lg border border-gray-200 px-3.5 py-2 text-sm shadow-sm
                       transition-all duration-300 focus:outline-none focus:ring-2
                       focus:ring-orange-400 sm:px-4 sm:py-2.5 sm:text-base"
              >
            </div>

            <p class="pt-1 text-center text-xs text-gray-500 sm:text-sm">
              <button
                type="button"
                id="forgot-password-button"
                class="transition-colors duration-300 hover:text-gray-700"
              >
                Forgot Password?
              </button>
            </p>

            <div class="pt-1">
              <button
                type="submit"
                class="w-full rounded-full bg-orange-500 py-2.5 text-sm font-semibold text-white
                       shadow-md transition-all duration-300 hover:bg-orange-600 active:scale-[0.97]
                       disabled:cursor-not-allowed disabled:opacity-60 sm:py-3 sm:text-base"
              >
                SIGN IN
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- SLIDING ORANGE OVERLAY -->
      <div
        class="relative order-1 w-full overflow-hidden
               md:absolute md:left-1/2 md:top-0 md:z-50 md:h-full md:w-1/2
               md:transition-transform md:duration-700 md:ease-in-out
               md:group-[.right-panel-active]:-translate-x-full"
      >
        <div
          class="relative flex w-full bg-gradient-to-br from-orange-400 via-orange-500
                 to-orange-600 text-white
                 md:left-[-100%] md:h-full md:w-[200%]
                 md:transition-transform md:duration-700 md:ease-in-out
                 md:group-[.right-panel-active]:translate-x-1/2"
        >
          <div
            class="hidden w-full flex-col items-center justify-center p-6 text-center
                   group-[.right-panel-active]:flex
                   md:absolute md:left-0 md:top-0 md:flex md:h-full md:w-1/2
                   md:-translate-x-[20%] md:transition-transform md:duration-700
                   md:group-[.right-panel-active]:translate-x-0"
          >
            <h2 class="mb-2 text-2xl font-extrabold leading-tight sm:text-3xl md:mb-4">
              Welcome To<br>CARTORA
            </h2>
            <p class="mb-4 text-xs text-white/90 sm:text-sm md:mb-6 md:text-base">
              Sign in to find your products
            </p>
            <button
              id="goSignIn"
              type="button"
              class="rounded-full border-[1.5px] border-white/85 bg-transparent px-6 py-2
                     text-xs font-bold transition-all duration-300 hover:bg-white/10
                     active:scale-95 sm:px-8 sm:py-2.5 sm:text-sm md:text-base"
            >
              SIGN IN
            </button>
          </div>

          <div
            class="flex w-full flex-col items-center justify-center p-6 text-center
                   group-[.right-panel-active]:hidden
                   md:absolute md:right-0 md:top-0 md:flex md:h-full md:w-1/2
                   md:transition-transform md:duration-700
                   md:group-[.right-panel-active]:flex
                   md:group-[.right-panel-active]:translate-x-[20%]"
          >
            <h2 class="mb-2 text-2xl font-extrabold leading-tight sm:text-3xl md:mb-4">
              Easy shopping with<br>CARTORA
            </h2>
            <p class="mb-4 text-xs text-white/90 sm:text-sm md:mb-6 md:text-base">
              Sign up now to enjoy your shopping
            </p>
            <button
              id="goSignUp"
              type="button"
              class="rounded-full border-[1.5px] border-white/85 bg-transparent px-6 py-2
                     text-xs font-bold transition-all duration-300 hover:bg-white/10
                     active:scale-95 sm:px-8 sm:py-2.5 sm:text-sm md:text-base"
            >
              SIGN UP
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const authCard = document.getElementById("authCard");
      const goSignUpButton = document.getElementById("goSignUp");
      const goSignInButton = document.getElementById("goSignIn");

      if (!authCard) return;

      requestAnimationFrame(() => {
        authCard.classList.remove("opacity-0", "translate-y-5", "scale-[0.98]");
        authCard.classList.add("opacity-100", "translate-y-0", "scale-100");
      });

      goSignUpButton?.addEventListener("click", () => {
        authCard.classList.add("right-panel-active");
      });

      goSignInButton?.addEventListener("click", () => {
        authCard.classList.remove("right-panel-active");
      });
    });
  </script>

  <script src="../js/auth.js" defer></script>
</body>
</html>
