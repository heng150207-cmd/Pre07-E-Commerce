<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartora - Cart & Payment</title>

  <!-- Tailwind CSS CLI output -->
  <link rel="stylesheet" href="../src/output.css">

  <!-- Local theme variables -->
  <link rel="stylesheet" href="../font/them.css">
</head>

<body class="min-h-screen bg-[#F8F4F2] font-(--heading) text-gray-900">

  <!-- ============================================================
       PASTE YOUR EXISTING NAVBAR HERE
  ============================================================= -->

  <main class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">

      <!-- ================= LEFT COLUMN ================= -->
      <div class="space-y-6 lg:col-span-7">

        <!-- Cart -->
        <section
          class="rounded-xl border border-gray-300 bg-[#FBFAFF] p-5 shadow-sm sm:p-7"
          aria-labelledby="cart-title"
        >
          <h1
            id="cart-title"
            class="text-3xl font-bold text-violet-500 sm:text-4xl"
          >
            Your Cart
          </h1>

          <!-- Desktop labels -->
          <div
            class="mt-5 hidden grid-cols-[1fr_90px_120px_90px] items-center
                   border-b border-gray-400 pb-3 text-xs font-medium text-gray-700
                   sm:grid"
          >
            <span></span>
            <span class="text-center">Price</span>
            <span class="text-center">Quantity</span>
            <span class="text-right">Sub Total</span>
          </div>

          <div id="cart-items" class="divide-y divide-gray-400">
            <!-- Rendered by cart.js -->
          </div>
        </section>

        <!-- Order summary -->
        <section
          class="rounded-xl border border-gray-300 bg-[#FBFAFF] p-5 shadow-sm sm:p-7"
          aria-labelledby="summary-title"
        >
          <h2
            id="summary-title"
            class="text-3xl font-bold text-violet-500"
          >
            Order Summary
          </h2>

          <div class="mt-6 space-y-5 text-lg">
            <div class="flex items-center justify-between">
              <span>Subtotal</span>
              <span id="summary-subtotal" class="font-medium">$0.00</span>
            </div>

            <div class="border-t border-gray-400 pt-5">
              <div class="flex items-center justify-between">
                <span class="font-semibold">Total</span>
                <span id="summary-total" class="font-semibold">$0.00</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- ================= PAYMENT COLUMN ================= -->
      <aside class="lg:col-span-5">
        <section
          class="overflow-hidden rounded-xl bg-white shadow-sm"
          aria-labelledby="payment-title"
        >
          <div class="bg-red-600 px-6 py-3 text-center text-white">
            <h2
              id="payment-title"
              class="text-3xl font-bold tracking-wide"
            >
              KHQR
            </h2>
          </div>

          <div class="p-6 sm:p-8">
            <p class="text-xl text-gray-600">CARTORA</p>

            <div class="mt-2 flex items-end gap-2">
              <span
                id="payment-amount"
                class="text-4xl font-medium text-gray-900"
              >
                0.00
              </span>
              <span class="pb-1 text-base font-medium text-gray-700">USD</span>
            </div>

            <div class="my-7 border-t-2 border-dashed border-gray-300"></div>

            <div class="flex justify-center py-4">
              <div class="relative rounded-lg bg-white p-3">
                <img
                  src="../images/khqr.jpg"
                  alt="KHQR payment code"
                  class="h-64 w-64 object-contain sm:h-72 sm:w-72"
                >

                <!-- <div
                  class="absolute left-1/2 top-1/2 flex h-12 w-12
                         -translate-x-1/2 -translate-y-1/2 items-center
                         justify-center rounded-full border-4 border-white
                         bg-red-600 text-lg font-bold text-white shadow"
                  aria-hidden="true"
                >
                  C
                </div> -->
              </div>
            </div>

            <p class="mt-4 text-center text-sm text-gray-500">
              Scan this QR code with your banking app.
            </p>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <!-- ============================================================
       PASTE YOUR EXISTING FOOTER HERE
  ============================================================= -->

  <script src="../js/cart.js" defer></script>
</body>
</html>
