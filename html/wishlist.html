<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist</title>
  <!-- Tailwind CSS link -->
  <link rel="stylesheet" href="../src/output.css">
  <!-- local style -->
  <link rel="stylesheet" href="../font/them.css">
</head>
<body class="bg-[#FAF8F5] font-(--heading) min-h-screen py-6 px-4 sm:px-8">
    
  <!-- ================= NAVBAR (Moved outside max-w-5xl for full width) ================= -->
  <header class="sticky top-2 z-50 w-full bg-white rounded-3xl border border-gray-200 shadow-xl mb-6">
    <div class="h-[70px] md:h-[95px] flex items-center justify-between px-4 sm:px-6 md:px-10">

      <!-- Logo + links -->
      <div class="flex items-center gap-4 md:gap-14">
        <span class="font-serif text-2xl sm:text-3xl md:text-[36px] tracking-wide text-gray-900"><a href="home-page.html">CARTORA</a></span>
        <span class="hidden md:block h-6 w-px bg-gray-200"></span>

        <nav class="hidden md:flex items-center gap-16 text-x font-medium tracking-wide text-gray-700">
          <a href="product-page.html" class="hover:text-brand-purple transition-colors">Products</a>
          <a href="about.html" class="hover:text-brand-purple transition-colors">About Us</a>
        </nav>
      </div>
      
      <!-- Right cluster -->
      <div class="flex items-center gap-3 sm:gap-5 md:gap-10">

        <label class="hidden md:flex items-center gap-3 bg-gray-100 rounded-2xl px-6 py-4 w-56 lg:w-96">
          <input type="text" placeholder="search......"
            class="bg-transparent outline-none text-sm w-full placeholder-gray-400" />
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </label>

        <button class="hidden md:inline-flex text-gray-800 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
          </svg>
        </button>

        <button class="text-gray-800 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 md:w-8 md:h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
          </svg>
        </button>

        <button class="hidden md:flex items-center gap-1.5 text-base text-gray-800 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Login
        </button>

        <button class="hidden md:inline-flex text-gray-800 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Hamburger toggle: tablet + phone only -->
        <button id="menuToggle" aria-label="Open menu" aria-expanded="false" class="md:hidden text-gray-800 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile / tablet dropdown menu -->
    <div id="mobileMenu" class="hidden md:hidden border-t border-gray-100 px-5 py-5 space-y-5">
      <label class="flex items-center gap-3 bg-gray-100 rounded-2xl px-4 py-3">
        <input type="text" placeholder="search......"
          class="bg-transparent outline-none text-sm w-full placeholder-gray-400" />
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </label>

      <nav class="flex flex-col gap-4 text-base font-medium tracking-wide text-gray-700">
        <a href="#" class="hover:text-brand-purple transition-colors">Products</a>
        <a href="#" class="hover:text-brand-purple transition-colors">About Us</a>
        <a href="#" class="flex items-center gap-2 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Login
        </a>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN CONTENT CONTAINER ================= -->
  <div class="max-w-5xl mx-auto bg-surface sm:bg-transparent rounded-2xl p-4 sm:p-8">
    <!-- Header -->
    <div class="border-b border-gray-300 pb-4 mb-6 flex items-center justify-between">
      <div class="text-3xl text-[32px] sm:text-[32px] md:text-[48px] lg:text-[48px] font-bold font-heading text-(--primary)">Wishlist</div>
      
      <!-- Select All Controls -->
      <label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-text-light hover:text-text-main select-none">
        <input type="checkbox" id="select-all" class="w-4 h-4 rounded border-gray-300 text-(--primary) focus:ring-(--primary) accent-(--primary) cursor-pointer">
        <span>Select All</span>
      </label>
    </div>

    <!-- Wishlist Items Container -->
    <div id="wishlist-container" class="space-y-6">
      <!-- Dynamic Items Rendered via JavaScript -->
    </div>

    <!-- Empty State (Hidden by Default) -->
    <div id="empty-state" class="hidden text-center py-12">
      <p class="text-text-light text-lg mb-4">Your wishlist is empty.</p>
      <button onclick="alert('Redirecting to shop...')" class="bg-(--primary) hover:bg-orange-400 text-white font-medium px-6 py-2.5 rounded-lg shadow-md transition-colors">
        Continue Shopping
      </button>
    </div>

    <!-- Bottom Actions -->
    <div id="action-bar" class="mt-8 pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-between gap-4 place-self-center sm:place-self-center md:place-self-end lg:place-self-end">
      <div class="flex flex-col sm:flex-row w-full sm:w-auto items-center gap-4">
        <button class="w-full sm:w-auto border border-(--primary) hover:bg-(--primary) hover:text-white font-(--heading) px-6 py-2.5 rounded-lg transition-colors">
         <a href=""> Continue Shopping </a>
        </button>
        <button id="add-all-btn" class="font-(--primary)  w-full sm:w-auto bg-(--primary) hover:bg-orange-400 text-white px-8 py-2.5 rounded-lg shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
         <a href=""> Add All To Cart </a>
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="../js/wishlist.js"></script>
</body>
</html>
