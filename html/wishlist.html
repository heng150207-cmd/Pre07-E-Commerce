<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartora - Wishlist</title>

  <!-- Tailwind CSS CLI output -->
  <link rel="stylesheet" href="../src/output.css">

  <!-- Local theme variables -->
  <link rel="stylesheet" href="../font/them.css">
</head>

<body class="min-h-screen bg-[#FAF8F5] px-4 py-6 font-(--heading) sm:px-8">

  <!-- ================= NAVBAR ================= -->
  <header
    class="sticky top-2 z-50 mb-6 w-full rounded-3xl border border-gray-200
           bg-white shadow-xl"
  >
    <div
      class="flex h-[70px] items-center justify-between px-4
             sm:px-6 md:h-[95px] md:px-10"
    >
      <!-- Logo + links -->
      <div class="flex items-center gap-4 md:gap-14">
        <a
          href="../index.html"
          class="font-serif text-2xl tracking-wide text-gray-900
                 sm:text-3xl md:text-[36px]"
        >
          CARTORA
        </a>

        <span class="hidden h-6 w-px bg-gray-200 md:block"></span>

        <nav
          class="hidden items-center gap-16 text-base font-medium
                 tracking-wide text-gray-700 md:flex"
          aria-label="Primary navigation"
        >
          <a
            href="product-page.html"
            class="transition-colors hover:text-brand-purple"
          >
            Products
          </a>

          <a
            href="about.html"
            class="transition-colors hover:text-brand-purple"
          >
            About Us
          </a>
        </nav>
      </div>

      <!-- Right cluster -->
      <div class="flex items-center gap-3 sm:gap-5 md:gap-10">
        <!-- Search -->
        <label
          class="hidden items-center gap-3 rounded-2xl bg-gray-100 px-6 py-4
                 md:flex md:w-56 lg:w-96"
        >
          <span class="sr-only">Search products</span>

          <input
            type="search"
            placeholder="Search..."
            class="w-full bg-transparent text-sm outline-none
                   placeholder:text-gray-400"
          >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 shrink-0 text-gray-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </label>

        <!-- Wishlist -->
        <a
          href="wishlist.html"
          aria-label="Wishlist"
          aria-current="page"
          class="hidden text-(--primary) transition-colors
                 hover:text-orange-400 md:inline-flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1
                 a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6
                 1-1a5.5 5.5 0 0 0 0-7.8z"
            ></path>
          </svg>
        </a>

        <!-- Cart -->
        <a
          href="cart.html"
          aria-label="Cart"
          class="text-gray-800 transition-colors hover:text-brand-purple"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 md:h-8 md:w-8"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path
              d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7
                 a2 2 0 0 0 2-1.6L23 6H6"
            ></path>
          </svg>
        </a>

        <!-- Login -->
        <a
          href="login.html"
          class="hidden items-center gap-1.5 text-base text-gray-800
                 transition-colors hover:text-brand-purple md:flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>

          Login
        </a>

        <!-- Theme button -->
        <button
          type="button"
          aria-label="Toggle theme"
          class="hidden text-gray-800 transition-colors
                 hover:text-brand-purple md:inline-flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M21 12.79A9 9 0 1 1 11.21 3
                 7 7 0 0 0 21 12.79z"
            ></path>
          </svg>
        </button>

        <!-- Mobile menu toggle -->
        <button
          id="menuToggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
          class="text-gray-800 transition-colors
                 hover:text-brand-purple md:hidden"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div
      id="mobileMenu"
      class="hidden space-y-5 border-t border-gray-100 px-5 py-5 md:hidden"
    >
      <label class="flex items-center gap-3 rounded-2xl bg-gray-100 px-4 py-3">
        <span class="sr-only">Search products</span>

        <input
          type="search"
          placeholder="Search..."
          class="w-full bg-transparent text-sm outline-none
                 placeholder:text-gray-400"
        >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 shrink-0 text-gray-400"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </label>

      <nav
        class="flex flex-col gap-4 text-base font-medium
               tracking-wide text-gray-700"
        aria-label="Mobile navigation"
      >
        <a
          href="product-page.html"
          class="transition-colors hover:text-brand-purple"
        >
          Products
        </a>

        <a
          href="about.html"
          class="transition-colors hover:text-brand-purple"
        >
          About Us
        </a>

        <a
          href="wishlist.html"
          aria-current="page"
          class="flex items-center gap-2 text-(--primary)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1
                 a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6
                 1-1a5.5 5.5 0 0 0 0-7.8z"
            ></path>
          </svg>

          Wishlist
        </a>

        <a
          href="cart.html"
          class="flex items-center gap-2 transition-colors
                 hover:text-brand-purple"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path
              d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7
                 a2 2 0 0 0 2-1.6L23 6H6"
            ></path>
          </svg>

          Cart
        </a>

        <a
          href="login.html"
          class="flex items-center gap-2 transition-colors
                 hover:text-brand-purple"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>

          Login
        </a>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main
    class="mx-auto max-w-5xl rounded-2xl bg-white p-4
           sm:bg-transparent sm:p-8"
  >
    <!-- Page heading -->
    <div
      class="mb-6 flex items-center justify-between border-b
             border-gray-300 pb-4"
    >
      <h1
        class="text-[32px] font-bold text-(--primary)
               md:text-[48px]"
      >
        Wishlist
      </h1>

      <label
        id="select-all-control"
        class="flex cursor-pointer select-none items-center gap-2
               text-sm font-medium text-text-light
               hover:text-text-main"
      >
        <input
          id="select-all"
          type="checkbox"
          class="h-4 w-4 cursor-pointer rounded border-gray-300
                 text-(--primary) accent-(--primary)
                 focus:ring-(--primary)"
        >

        <span>Select All</span>
      </label>
    </div>

    <!-- Wishlist items -->
    <div id="wishlist-container" class="space-y-6">
      <!-- Rendered by wishlist.js -->
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden py-12 text-center">
      <p class="mb-4 text-lg text-text-light">
        Your wishlist is empty.
      </p>

      <a
        href="product-page.html"
        class="inline-block rounded-lg bg-(--primary) px-6 py-2.5
               font-medium text-white shadow-md transition-colors
               hover:bg-orange-400"
      >
        Continue Shopping
      </a>
    </div>

    <!-- Bottom actions -->
    <div
      id="action-bar"
      class="mt-8 flex flex-col gap-4 border-t border-gray-200 pt-6
             sm:flex-row sm:justify-end"
    >
      <div
        class="flex w-full flex-col items-center gap-4
               sm:w-auto sm:flex-row"
      >
        <a
          href="product-page.html"
          class="w-full rounded-lg border border-(--primary)
                 px-6 py-2.5 text-center transition-colors
                 hover:bg-(--primary) hover:text-white sm:w-auto"
        >
          Continue Shopping
        </a>

        <button
          id="add-all-btn"
          type="button"
          class="w-full rounded-lg bg-(--primary) px-8 py-2.5
                 text-white shadow-md transition-colors
                 hover:bg-orange-400 disabled:cursor-not-allowed
                 disabled:opacity-50 sm:w-auto"
        >
          Add Selected To Cart
        </button>
      </div>
    </div>
  </main>

  <!-- Mobile menu behavior -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const menuToggle = document.getElementById("menuToggle");
      const mobileMenu = document.getElementById("mobileMenu");

      if (!menuToggle || !mobileMenu) {
        return;
      }

      menuToggle.addEventListener("click", () => {
        const menuIsHidden = mobileMenu.classList.toggle("hidden");

        menuToggle.setAttribute(
          "aria-expanded",
          String(!menuIsHidden)
        );
      });
    });
  </script>

  <script src="../js/wishlist.js" defer></script>
</body>
</html>
