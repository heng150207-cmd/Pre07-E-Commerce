<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartora - Your Cart</title>
    <!-- <link rel="stylesheet" href="./src/output.css" /> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./font/them.css" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              pagebg: "#eef0f5",
              brandpurple: "#6f5fc9",
              brandpurplelight: "#efeafc",
              brandgreen: "#2e9b4f",
              brandred: "#e13c3c",
              bordersoft: "#ececf2",
              textmuted: "#8a8a97",
            },
            borderRadius: {
              card: "18px",
            },
            boxShadow: {
              card: "0 4px 20px rgba(30, 20, 60, 0.06)",
            },
          },
        },
      };
    </script>
    <!--
      Sets the dark/light class on <html> BEFORE the page paints,
      so there's no flash of the wrong theme on load.
    -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body
    class="bg-pagebg dark:bg-[#12121a] text-[#2b2b33] dark:text-[#e7e7ee] font-sans min-h-screen transition-colors"
  >
    <div class="max-w-[1200px] mx-auto p-6">
      <!-- Navbar -->
      <header
        class="w-[95%] mx-auto mt-[0.5%] bg-white dark:bg-[#1b1b26] rounded-3xl border border-gray-200 dark:border-[#2a2a38] shadow-xl transition-colors"
      >
        <div class="h-[95px] flex items-center justify-between px-10">
          <!-- Logo + links -->
          <div class="flex items-center gap-14">
            <span
              class="font-serif text-[36px] tracking-wide text-gray-900 dark:text-white"
              >CARTORA</span
            >
            <span
              class="hidden md:block h-6 w-px bg-gray-200 dark:bg-[#2a2a38]"
            ></span>

            <nav
              class="hidden md:flex items-center gap-16 text-sm font-medium tracking-wide text-gray-700 dark:text-gray-300"
            >
              <a href="#" class="hover:text-brandpurple transition-colors"
                >Products</a
              >
              <a href="#" class="hover:text-brandpurple transition-colors"
                >About Us</a
              >
            </nav>
          </div>

          <!-- Right cluster -->
          <div class="flex items-center gap-10">
            <label
              class="hidden md:flex items-center gap-3 bg-gray-100 dark:bg-[#242430] rounded-2xl px-6 py-4 w-96 transition-colors"
            >
              <input
                type="text"
                placeholder="search......"
                class="bg-transparent outline-none text-sm w-full placeholder-gray-400 dark:placeholder-gray-500 text-gray-900 dark:text-gray-200"
              />
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 text-gray-400 dark:text-gray-500 shrink-0"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </label>

            <!-- Cart -->
            <button
              class="text-gray-800 dark:text-gray-300 hover:text-brandpurple transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-8 h-8"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path
                  d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"
                ></path>
              </svg>
            </button>

            <!-- Login -->
            <button
              class="hidden sm:flex items-center gap-1.5 text-base text-gray-800 dark:text-gray-300 hover:text-brandpurple transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-8 h-8"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              Login
            </button>

            <!-- Dark mode toggle -->
            <button
              id="theme-toggle"
              type="button"
              aria-label="Toggle dark mode"
              class="text-gray-800 dark:text-gray-300 hover:text-brandpurple transition-colors"
            >
              <svg
                id="icon-moon"
                xmlns="http://www.w3.org/2000/svg"
                class="w-8 h-8"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                ></path>
              </svg>
              <svg
                id="icon-sun"
                xmlns="http://www.w3.org/2000/svg"
                class="w-8 h-8 hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4"></circle>
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </header>
      <!-- Big Outer Container -->
      <div
        class="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-6 items-start mt-6"
      >
        <!-- Cart + Order Summary -->
        <div class="flex flex-col gap-6">
          <!-- Cart -->
          <div
            class="bg-white dark:bg-[#1b1b26] rounded-card shadow-card p-7 transition-colors"
          >
            <h2 class="text-brandpurple text-xl font-bold mb-5">Your Cart</h2>
            <div
              class="hidden sm:grid grid-cols-[2fr_1fr_1.4fr_1fr] text-xs text-textmuted pb-2"
            >
              <span></span>
              <span class="text-center">Price</span>
              <span class="text-center">Quantity</span>
              <span class="text-center">Sub Total</span>
            </div>

            <!-- Cart items get injected here from inject-cart.js -->
            <div id="cart-items" data-loading-text="Loading cart items...">
              <p
                class="text-sm text-textmuted py-6 text-center"
                id="cart-loading-msg"
              >
                Loading cart items...
              </p>
            </div>
          </div>

          <!-- Order Summary -->
          <div
            class="bg-white dark:bg-[#1b1b26] rounded-card shadow-card p-7 transition-colors"
          >
            <h2 class="text-brandpurple text-xl font-bold mb-5">
              Order Summary
            </h2>
            <div class="flex justify-between text-sm py-3">
              <span>Subtotal</span>
              <span id="subtotal-value">$0</span>
            </div>
            <hr class="border-t border-bordersoft dark:border-[#2a2a38]" />
            <div class="flex justify-between text-[15px] font-bold py-3">
              <span>Total</span>
              <span id="total-value">$0</span>
            </div>
          </div>
        </div>

        <!-- Payment / QR -->
        <div
          class="bg-white dark:bg-[#1b1b26] rounded-card shadow-card overflow-hidden h-fit transition-colors"
        >
          <div
            class="bg-brandred text-white text-center py-4 font-extrabold text-xl tracking-wide"
          >
            KHQR
          </div>
          <div class="px-7 pt-6 pb-8">
            <div class="text-textmuted text-[15px] mb-1" id="merchant-name">
              CARTORA
            </div>
            <div class="text-2xl font-bold mb-4" id="payment-amount">
              <span id="amount-value">0.00</span>
              <span class="text-sm font-semibold text-textmuted ml-1">USD</span>
            </div>
            <hr
              class="border-t-2 border-dashed border-bordersoft dark:border-[#2a2a38] mb-6"
            />

            <!-- QR image, properly sized/bordered so it doesn't render at raw pixel size -->
            <div
              class="w-full aspect-square bg-[#fafafa] dark:bg-[#242430] border border-bordersoft dark:border-[#2a2a38] rounded-xl overflow-hidden flex items-center justify-center transition-colors"
            >
              <img
                id="qr-image"
                src="./img/qr-code.png"
                alt="KHQR code"
                class="w-full h-full object-contain"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./theme.js"></script>
    <script src="./inject-cart.js"></script>
  </body>
</html>
